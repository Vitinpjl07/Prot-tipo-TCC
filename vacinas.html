<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vacinas - Maternis</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#F8F4FF;
    font-family:Poppins,sans-serif;
}

.topo{
    background:linear-gradient(135deg,#F78FB3,#D980FA);
    color:white;
    padding:25px;
    border-bottom-left-radius:30px;
    border-bottom-right-radius:30px;
}

.banner{
    background:white;
    margin-top:-20px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    overflow:hidden;
}

.banner img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.banner h4{
    font-weight:700;
}

.card-vacina{

    background:white;
    border-radius:18px;
    padding:18px;
    margin-top:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.06);

}

.status{

    float:right;
    font-weight:600;

}

.aplicada{

    color:#2ECC71;

}

.pendente{

    color:#F39C12;

}

.btn-maternis{

    background:#D980FA;
    color:white;
    border:none;

}

.btn-maternis:hover{

    background:#c15df2;
    color:white;

}

.lista{

    margin-top:20px;

}

.item{

    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,.05);

}
.text-secondary{
   color:yellow;
}

</style>

</head>

<body>

<div class="topo">

<h3>Vacinas</h3>

</div>

<div class="container">

<div class="banner mt-4">

<img src="img/bebe.jpg">

<div class="p-4">

<h4>Mantenha a vacinação em dia 💜</h4>

<p class="text-muted">
Acompanhe todas as vacinas do seu bebê de forma simples.
</p>

</div>

</div>

<div class="card-vacina">


</p>

<div class="mt-3">



</div>

</div>

<div class="lista">

    <h5 class="mb-3">Minhas Vacinas</h5>

    <div class="row g-2 mb-4">

        <div class="col-md-4">
            <input
                type="text"
                id="nomeVacina"
                class="form-control"
                placeholder="Nome da vacina">
        </div>

        <div class="col-md-3">
            <input
                type="date"
                id="dataVacina"
                class="form-control">
        </div>

        <div class="col-md-3">

            <select id="statusNova" class="form-select">

                <option value="Pendente">🟡 Pendente</option>

                <option value="Aplicada">✅ Aplicada</option>

            </select>

        </div>

        <div class="col-md-2">

            <button
                class="btn btn-maternis w-100"
                onclick="adicionarVacina()">

                Adicionar

            </button>

        </div>

    </div>

    <div id="listaVacinas"></div>

</div>

</div>

</div>

<script>

let vacinas = JSON.parse(localStorage.getItem("vacinas")) || [];

mostrarVacinas();

function adicionarVacina(){

    const nome = document.getElementById("nomeVacina").value.trim();
    const data = document.getElementById("dataVacina").value;
    const status = document.getElementById("statusNova").value;

    if(nome == ""){

        alert("Digite o nome da vacina.");

        return;

    }

    vacinas.push({

        nome,
        data,
        status

    });

    salvar();

    document.getElementById("nomeVacina").value="";
    document.getElementById("dataVacina").value="";

}

function salvar(){

    localStorage.setItem("vacinas",JSON.stringify(vacinas));

    mostrarVacinas();

}

function mostrarVacinas(){

    const lista=document.getElementById("listaVacinas");

    lista.innerHTML="";

    vacinas.forEach((vacina,index)=>{

        lista.innerHTML += `

        <div class="item">

            <div>

                <strong>💉 ${vacina.nome}</strong><br>

                <small>📅 ${vacina.data || "Sem data"}</small>

            </div>

            <div>

                <span class="${vacina.status=="Aplicada" ? "aplicada":"pendente"}">

                    ${vacina.status}

                </span>

                <br>

                <button
                    class="btn btn-sm btn-danger mt-2"
                    onclick="removerVacina(${index})">

                    Excluir

                </button>

            </div>

        </div>

        `;

    });

}

function removerVacina(index){

    if(confirm("Deseja excluir esta vacina?")){

        vacinas.splice(index,1);

        salvar();

    }

}

</script>

</body>
</html>
